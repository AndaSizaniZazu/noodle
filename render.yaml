# Render Blueprint for the Noodle API. In Render: New > Blueprint > pick this repo.
# Render asks for the two secret values (sync: false) when you create the Blueprint; they never go in git.
services:
  - type: web
    name: noodle-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: ConnectionStrings__Supabase
        sync: false
      - key: OpenRouter__ApiKey
        sync: false
